; PlatformIO Project Configuration File
;
; Speaker-compact — ESP32-S3-N16R8, минимальная версия прошивки.
; Конфигурация повторяет audio_test (тот же чипсет/экосистема библиотек),
; см. CLAUDE.md §4.3.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=3
; -DBOARD_HAS_PSRAM не включаем: проект PSRAM не использует (нет камеры/
; фреймбуферов), а профиль борда esp32-s3-devkitc-1 собран как "No PSRAM" —
; тот же урок, что и в audio_test (флаг только провоцирует "PSRAM init failed").
; esphome-форк — стабильно работает с AsyncWebServer/WebSocket на ESP32.
lib_deps =
	AsyncTCP-esphome
	esphome/ESPAsyncWebServer-esphome@^3.3.0
; Используем только "голые" декодеры MP3Decode()/AACDecode() из этой
; библиотеки, не класс Audio целиком — см. CLAUDE.md §4.3 и codec.cpp.
	esphome/ESP32-audioI2S@^2.3.0
; ESPAsyncWebServer тянет ESPAsyncTCP (ESP8266) и RPAsyncTCP (RP2040) как условные
; зависимости под другие платформы — LDF иногда всё равно их компилирует и ловит
; конфликт с lwIP на ESP32. Явно исключаем, чтобы использовался только AsyncTCP.
lib_ignore =
	ESPAsyncTCP
	RPAsyncTCP

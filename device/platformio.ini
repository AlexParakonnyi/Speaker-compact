; PlatformIO Project Configuration File
;
; Speaker-compact — ESP32-S3-N16R8, минимальная версия прошивки.
; Конфигурация повторяет audio_test (тот же чипсет/экосистема библиотек),
; см. CLAUDE.md §4.3.

; Плата — не официальный Espressif devkit, а сторонняя несущая плата
; "XH-S3E_V1.2" с модулем "S3-N16R8" (подтверждено по фото, см.
; device/docs/*.jpg и wiring.md). Профиль esp32-s3-devkitc-1 используется
; только как источник дефолтных пинов тулчейна/SPI/I2C — реальные номера GPIO
; сверены с шелкографией платы и совпадают с тем, что нужно (см. wiring.md).
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_speed = 115200
; Реальный флеш — 16MB (N16), профиль devkitc-1 по умолчанию считает 8MB —
; без этой строки часть флеша физически недоступна прошивке/партициям.
board_build.flash_size = 16MB
build_flags =
	-DCORE_DEBUG_LEVEL=3
; -DBOARD_HAS_PSRAM не включаем: проект пока не использует PSRAM (нет
; камеры/фреймбуферов), хотя чип физически Octal PSRAM имеет (N16R8,
; подтверждено по фото модуля). Если понадобится — включать вместе с
; board_build.arduino.memory_type=qio_opi, не одним только флагом (в
; audio_test флаг без memory_type давал "PSRAM init failed").
; esphome-форк — стабильно работает с AsyncWebServer/WebSocket на ESP32.
lib_deps =
	AsyncTCP-esphome
	esphome/ESPAsyncWebServer-esphome@^3.3.0
; Используем только "голые" декодеры MP3Decode()/AACDecode() из этой
; библиотеки, не класс Audio целиком — см. CLAUDE.md §4.3 и codec.cpp.
	esphome/ESP32-audioI2S@^2.3.0
; ESPAsyncWebServer тянет ESPAsyncTCP (ESP8266) и RPAsyncTCP (RP2040) как условные
; зависимости под другие платформы — LDF иногда всё равно их компилирует и ловит
; конфликт с lwIP на ESP32. Явно исключаем, чтобы использовался только AsyncTCP.
lib_ignore =
	ESPAsyncTCP
	RPAsyncTCP
